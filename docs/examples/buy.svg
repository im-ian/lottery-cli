<svg xmlns="http://www.w3.org/2000/svg" width="820" height="258" font-family="Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="14" xml:space="preserve">
  <rect width="100%" height="100%" fill="#1e1e2e" rx="6"/>
  <g fill="#cdd6f4">
    <text x="20" y="36"><tspan fill="#cba6f7">▸</tspan> 이번 주 구매 현황 확인 중...</text>
    <text x="20" y="58"><tspan fill="#94e2d5">ℹ</tspan> 이번 회차 구매 현황:</text>
    <text x="20" y="80" fill="#6c7086">  · 로또 6/45: 미구매 · 이번 회차 마감: 토 20:00</text>
    <text x="20" y="102" fill="#a6e3a1">  ✓ 연금복권 720+: 1건 (313회차) · 다음 회차 구매: 목 21:00 이후</text>
    <text x="20" y="124" font-weight="700" fill="#ffffff">? 어떤 복권을 구매할까요? (Esc: 메인으로)</text>
    <text x="20" y="146"><tspan fill="#94e2d5">❯</tspan> ⚡ 모두 자동 구매 (로또 5게임 + 연금 5게임, 최대 10,000원)</text>
    <text x="20" y="168">  로또 6/45</text>
    <text x="20" y="190" fill="#6c7086">  연금복권 720+ (이미 구매함 — 다음 회차는 목 21:00 이후)</text>
    <text x="20" y="212">  스피또 (온라인 구매 불가 — 안내만)</text>
    <text x="20" y="234">  ◀ 메인으로 돌아가기</text>
  </g>
</svg>
